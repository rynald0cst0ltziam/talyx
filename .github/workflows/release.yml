# Builds and publishes talyx + talyx-shim release binaries when a
# `v*` tag is pushed. Not run automatically otherwise, and pushing a tag
# from a local clone is the only thing that triggers it — nothing in this
# repo runs this workflow on its own. See scripts/install.sh, install.ps1,
# and npm/scripts/install.js: they download the exact archive names this
# workflow produces, so a rename here must be mirrored there.
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels verified against actions/runner-images: macos-13
          # no longer exists (retired) and macos-14 is deprecated, so both
          # of the original entries here would have failed the first time
          # a tag was ever pushed. macos-15 is Apple Silicon, and
          # macos-15-intel is the x86_64 image.
          - os: macos-15 # Apple Silicon
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-15-intel # Intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          # Linux ships STATIC musl binaries, not glibc-linked ones.
          # A binary built against ubuntu-latest's glibc requires that
          # version or newer at runtime, so it simply refuses to start on
          # Debian 12, RHEL 9, Amazon Linux 2 and Ubuntu 22.04 — a
          # download that installs fine and then can't run is worse than
          # no download at all. Nothing here needs glibc: TLS is rustls
          # over `ring` (no OpenSSL) and compression is pure-Rust
          # miniz_oxide (no libz-sys), so the only C is tree-sitter,
          # which builds against musl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            needs_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            needs_musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc, for the one C dependency (tree-sitter). Without it the
      # build fails at link time rather than producing a bad binary.
      - name: Install musl toolchain
        if: matrix.needs_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build talyx + talyx-shim
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p talyx-cli -p talyx-shim

      # Proves the portability claim rather than assuming it: a musl
      # build that silently linked against glibc would pass every test
      # here and still fail to start on the distros this targets.
      - name: Verify the Linux binaries are static
        if: matrix.needs_musl
        run: |
          set -eu
          for b in talyx talyx-shim; do
            path="target/${{ matrix.target }}/release/$b"
            info="$(file -b "$path")"
            echo "$b: $info"
            case "$info" in
              *"statically linked"*|*"static-pie linked"*) ;;
              *)
                echo "::error::$b is not statically linked ($info) — it would fail to start on distros with an older glibc"
                exit 1
                ;;
            esac
            "$path" --version
          done

      # The MIT / BSD / Apache-2.0 / ISC licenses of the bundled crates
      # require their notices to travel with the binary. Regenerate and fail
      # the release if the committed THIRD-PARTY-LICENSES.txt is stale (a new
      # or changed dependency, or a license not vetted in about.toml).
      - name: Verify third-party license notices
        shell: bash
        run: |
          set -uo pipefail
          # Pinned: `cargo install cargo-about` without a version installs
          # whatever is newest, so a change in ITS output formatting would
          # fail this check on an unrelated release with no dependency
          # change at all. Bump deliberately, regenerating the committed
          # file in the same commit.
          cargo install cargo-about --version 0.9.2 --features cli --locked
          cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
          git diff --exit-code THIRD-PARTY-LICENSES.txt || {
            echo "::error::THIRD-PARTY-LICENSES.txt is stale — run 'cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt' and commit the result."
            exit 1
          }

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          out="talyx-${{ matrix.target }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/talyx" "$out/"
          cp "target/${{ matrix.target }}/release/talyx-shim" "$out/"
          cp README.md "$out/" 2>/dev/null || true
          cp LICENSE "$out/" 2>/dev/null || true
          cp THIRD-PARTY-LICENSES.txt "$out/"
          tar czf "$out.tar.gz" "$out"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $out = "talyx-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/talyx.exe" "$out/"
          Copy-Item "target/${{ matrix.target }}/release/talyx-shim.exe" "$out/"
          if (Test-Path README.md) { Copy-Item README.md "$out/" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$out/" }
          Copy-Item THIRD-PARTY-LICENSES.txt "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: talyx-${{ matrix.target }}
          path: talyx-${{ matrix.target }}.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required by attest-build-provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `talyx advisories refresh` fetches this file over HTTPS from the
      # latest release. It was never uploaded, so that command could only
      # ever fail — the feed shipped inside the binary was the only one a
      # user could have, with no way to get a newer one between releases.
      - name: Stage the advisory feed as a release asset
        run: cp data/advisories.json dist/advisories.json

      # A security tool whose own downloads can't be verified is asking
      # for trust it hasn't earned. The installers check these (see
      # scripts/install.sh + install.ps1).
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true # review the draft before publishing — nothing goes live automatically
          generate_release_notes: true
