# Builds and publishes talyx + talyx-shim release binaries when a
# `v*` tag is pushed. Not run automatically otherwise, and pushing a tag
# from a local clone is the only thing that triggers it — nothing in this
# repo runs this workflow on its own. See scripts/install.sh, install.ps1,
# and npm/scripts/install.js: they download the exact archive names this
# workflow produces, so a rename here must be mirrored there.
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner labels verified against actions/runner-images: macos-13
          # no longer exists (retired) and macos-14 is deprecated, so both
          # of the original entries here would have failed the first time
          # a tag was ever pushed. macos-15 is Apple Silicon, and
          # macos-15-intel is the x86_64 image.
          - os: macos-15 # Apple Silicon
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-15-intel # Intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          # Linux ships STATIC musl binaries, not glibc-linked ones.
          # A binary built against ubuntu-latest's glibc requires that
          # version or newer at runtime, so it simply refuses to start on
          # Debian 12, RHEL 9, Amazon Linux 2 and Ubuntu 22.04 — a
          # download that installs fine and then can't run is worse than
          # no download at all. Nothing here needs glibc: TLS is rustls
          # over `ring` (no OpenSSL) and compression is pure-Rust
          # miniz_oxide (no libz-sys), so the only C is tree-sitter,
          # which builds against musl.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            needs_musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive_ext: tar.gz
            needs_musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl-gcc, for the one C dependency (tree-sitter). Without it the
      # build fails at link time rather than producing a bad binary.
      - name: Install musl toolchain
        if: matrix.needs_musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # `+crt-static` is the default for musl targets, but it is stated
      # explicitly here because it is the property the whole Linux
      # portability story depends on — a silent default is not something
      # to leave load-bearing and unstated.
      - name: Build talyx + talyx-shim
        env:
          RUSTFLAGS: ${{ matrix.needs_musl && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p talyx-cli -p talyx-shim

      # Diagnostic, deliberately non-fatal: it records what was actually
      # produced so the claim is checkable, without letting a quirk of
      # `file`/`ldd` output formatting block a release. The binding check
      # is performed on the PUBLISHED archive after the fact — that tests
      # what a customer actually downloads, which is the thing that has
      # to work.
      - name: Report Linux binary linkage
        if: matrix.needs_musl
        continue-on-error: true
        run: |
          for b in talyx talyx-shim; do
            path="target/${{ matrix.target }}/release/$b"
            echo "== $b =="
            file -b "$path" || true
            "$path" --version || true
          done

      # NOTE: the freshness of THIRD-PARTY-LICENSES.txt is verified once,
      # in ci.yml, not here. It used to run in this matrix, where it
      # regenerated the file on five different operating systems and
      # demanded all five agree — a check that could only ever pass on
      # whichever OS last generated the committed copy, and that blocked
      # four consecutive releases without ever saying what differed. The
      # committed file is what ships; one canonical check gates it.

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          out="talyx-${{ matrix.target }}"
          mkdir "$out"
          cp "target/${{ matrix.target }}/release/talyx" "$out/"
          cp "target/${{ matrix.target }}/release/talyx-shim" "$out/"
          cp README.md "$out/" 2>/dev/null || true
          cp LICENSE "$out/" 2>/dev/null || true
          cp THIRD-PARTY-LICENSES.txt "$out/"
          tar czf "$out.tar.gz" "$out"

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $out = "talyx-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/talyx.exe" "$out/"
          Copy-Item "target/${{ matrix.target }}/release/talyx-shim.exe" "$out/"
          if (Test-Path README.md) { Copy-Item README.md "$out/" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$out/" }
          Copy-Item THIRD-PARTY-LICENSES.txt "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: talyx-${{ matrix.target }}
          path: talyx-${{ matrix.target }}.${{ matrix.archive_ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required by attest-build-provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `talyx advisories refresh` fetches this file over HTTPS from the
      # latest release. It was never uploaded, so that command could only
      # ever fail — the feed shipped inside the binary was the only one a
      # user could have, with no way to get a newer one between releases.
      - name: Stage the advisory feed as a release asset
        run: cp data/advisories.json dist/advisories.json

      # A security tool whose own downloads can't be verified is asking
      # for trust it hasn't earned. The installers check these (see
      # scripts/install.sh + install.ps1).
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # Publishes immediately. This was a draft, which meant every
          # release needed someone to click Publish before the download
          # URLs stopped 404ing — and install.sh points at
          # /releases/latest/download/, so a forgotten click is a broken
          # install for every customer, with nothing failing to say so.
          # The tag is the deliberate act; requiring a second one just
          # moves the failure somewhere less visible.
          draft: false
          generate_release_notes: true

  # npm publishing runs only after the GitHub release succeeded, and only
  # when NPM_TOKEN is configured — so the release is never blocked by npm
  # credentials that may not exist yet.
  #
  # Six packages: five per-platform ones carrying the binaries, and the
  # `talyx` launcher that lists them as optionalDependencies. No
  # postinstall anywhere — see npm/talyx/bin/talyx.js for why that matters
  # for this product in particular.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance`: npm verifies the package
      # was built by this workflow using a short-lived OIDC token from
      # GitHub. Without this the publish fails outright rather than
      # quietly publishing without provenance.
      id-token: write
    # Set at JOB level, not on the publish step. A step's own `env:` block
    # is not in scope for that step's own `if:` condition, so testing
    # `env.NODE_AUTH_TOKEN` there always saw an empty string and the
    # publish was skipped no matter what — the job still went green,
    # which is precisely how it went unnoticed for a release. Job-level
    # env IS visible to step conditions.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20: npm's trusted publishing (OIDC) needs npm
          # >= 11.5.1 / Node >= 22.14.0, and staged publishing needs npm
          # >= 11.15.0. Direct publishing with a granular token is being
          # removed in January 2027, so both of the paths that outlive it
          # require this floor. Node 20 is also already deprecated on the
          # runners and was warning on every run.
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Stage the publish tree
        run: node npm/build-packages.mjs --artifacts dist --out npm-dist

      - name: Verify every package carries a binary
        run: |
          set -euo pipefail
          for d in npm-dist/talyx-*/; do
            name=$(node -p "require('./$d/package.json').name")
            count=$(find "$d/bin" -type f | wc -l)
            echo "$name: $count binary file(s)"
            if [ "$count" -lt 2 ]; then
              echo "::error::$name is missing binaries — refusing to publish"
              exit 1
            fi
          done

      # Reports WHO the token is before attempting anything, because the
      # two likely failures — a token generated with no package
      # permissions, and a missing @talyx org — are both invisible in a
      # bare "exit code 1".
      # Emitted as ANNOTATIONS, not plain log lines. Raw job logs need
      # repository admin rights; annotations do not. Three tags failed on
      # an unreadable 404 while the one fact that explains it — who the
      # token actually is — sat in a log nobody could open.
      #
      # This matters because an unauthenticated or unauthorised publish
      # to a scoped name returns 404, not 403: npm will not confirm that
      # a scope exists to someone who cannot write to it. A bad token and
      # a missing organisation are therefore indistinguishable at the
      # publish step, and only `whoami` tells them apart.
      - name: Check npm identity and scope access
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          flatten() { head -4 | paste -sd' ' - | cut -c1-300; }
          if who=$(npm whoami 2>&1); then
            echo "::notice::npm authenticated as ${who}"
          else
            echo "::error::npm whoami FAILED — NPM_TOKEN is invalid, revoked, or not the token you think it is: $(printf '%s' "$who" | flatten)"
          fi
          # NOT treated as a failure. `npm org ls` requires the token's
          # Organizations:read permission, which a token scoped purely
          # for publishing does not have — verified locally, where
          # `whoami` succeeds and publishing works while this 403s. A
          # publish token SHOULD fail here, so an error would send the
          # next person after the wrong thing entirely.
          if org=$(npm org ls talyx 2>&1); then
            echo "::notice::@talyx org readable: $(printf '%s' "$org" | flatten)"
          else
            echo "::notice::@talyx org not readable by this token (expected for a publish-only token, not a fault): $(printf '%s' "$org" | flatten)"
          fi

      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          # Deliberately NOT `set -e`: each publish is attempted and its
          # error surfaced as an annotation, because the raw logs need
          # admin rights that the release process cannot assume. A
          # failure that cannot be read is a failure that cannot be fixed.
          rc=0
          publish() {
            local dir="$1"
            local name
            name=$(node -p "require('./$dir/package.json').name")
            echo "::group::publishing $name"
            if ! out=$( (cd "$dir" && npm publish --access public --provenance) 2>&1 ); then
              echo "$out"
              echo "::error::$name failed to publish"
              # npm's diagnosis is usually one specific line; surface the
              # whole thing, trimmed, rather than guessing which matters.
              echo "$out" | grep -E "npm (error|ERR!)" | head -12 | while IFS= read -r line; do
                echo "::error::${line}"
              done
              rc=1
            else
              echo "$out" | tail -3
              echo "published $name"
            fi
            echo "::endgroup::"
          }

          # Platform packages first: the launcher lists them as
          # optionalDependencies, and publishing it before they exist
          # would leave a window where `npm i -g talyx` resolves nothing
          # to run.
          for d in npm-dist/talyx-*/; do
            publish "${d%/}"
          done
          if [ "$rc" -eq 0 ]; then
            publish "npm-dist/talyx"
          else
            echo "::error::skipping the launcher package — a platform package failed, and a launcher whose optionalDependencies do not exist is worse than none."
          fi
          exit "$rc"

      # Fails the job rather than passing quietly. A silent skip is how
      # v0.3.0 and v0.3.1 both reported success while publishing nothing;
      # if the token is missing the release should say so loudly.
      - name: Fail if the token was missing
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: |
          echo "::error::NPM_TOKEN is not set — the GitHub release published but npm did not."
          exit 1
