# Runs the workspace test suite + clippy on every push and PR, and builds
# the marketing site. This is the regression gate the repo's "if it's
# listed as done, it's built and tested" discipline relies on — nothing
# else ran the 340+ tests automatically before this.
#
# `cargo fmt --check` is deliberately NOT enforced: the codebase was
# written to a house style that predates any rustfmt run, so turning it on
# would mean a 400+ block reformat commit first. Add it (with a
# `rustfmt.toml` matching the existing width) as a separate decision.
name: CI

"on":
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ubuntu / Windows / macOS, because this codebase's real bugs have lived
  # precisely in the differences between them: a `Path::file_stem()` that
  # only treats `\` as a separator on Windows, an installer that only
  # breaks under Debian's dash. A Linux-only gate could not have caught
  # either one.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      # `--locked` so a dependency that silently resolves to a newer
      # version than Cargo.lock pins fails the build instead of being
      # picked up unnoticed — the lockfile is part of what gets audited.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The MSRV in Cargo.toml (`rust-version`) is a promise to anyone
  # building from source. Without a job pinned to exactly that version,
  # using a newer toolchain's API breaks them and nothing here notices —
  # `stable` above always has more available than 1.89 does.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Build at the declared MSRV
        run: cargo build --workspace --locked

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npx astro check
      - run: npx astro build
