[package]
name = "agentguard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentguard"
path = "src/main.rs"

[dependencies]
agentguard-core = { path = "../agentguard-core" }
agentguard-scanner = { path = "../agentguard-scanner" }
agentguard-adapters = { path = "../agentguard-adapters" }
agentguard-risk = { path = "../agentguard-risk" }
agentguard-store = { path = "../agentguard-store" }
agentguard-registry = { path = "../agentguard-registry" }
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
# YAML read + write for `agentguard init`'s rewrite of Goose / Continue.dev
# / Aider configs (STATUS.md 5c). Same crate agentguard-adapters uses for
# discovery — see the workspace dependency's own comment on why not
# serde_yaml/serde_yml.
serde-saphyr.workspace = true
