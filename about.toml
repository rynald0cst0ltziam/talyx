# cargo-about configuration for generating THIRD-PARTY-LICENSES.
# Run:  cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
#
# `targets` pins the platforms the notices are generated for. Without it,
# cargo-about resolves only the HOST's dependency graph — macOS pulls in
# Apple-specific crates that Windows and Linux never see — so the output
# differed per machine and the release workflow's freshness check could
# only ever pass on whichever OS last generated the file. Pinning every
# shipped target makes generation deterministic AND makes the notices
# legally complete for every binary actually published, not just the one
# built on the generating machine.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Build- and dev-dependencies resolve for the HOST machine, not for the
# targets above, so leaving them in made the output differ depending on
# which OS generated it — the release check passed on Windows and failed
# on Linux and macOS for the same commit. They are also genuinely out of
# scope: a build script's or test harness's dependencies are not linked
# into the shipped binaries, so their notices do not need to travel with
# them. Excluding both is what makes this file reproducible anywhere.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# `accepted` lists every SPDX license that actually appears in the
# dependency tree (verified with `cargo license`). All are permissive or
# file-level weak-copyleft (MPL-2.0) — none impose a copyleft obligation on
# Talyx's own source. If a new dependency introduces a license not in
# this list, `cargo about generate` fails loudly so it gets reviewed.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "Unlicense",
]
