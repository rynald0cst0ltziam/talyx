[workspace]
resolver = "2"
members = [
    "crates/agentguard-core",
    "crates/agentguard-scanner",
    "crates/agentguard-adapters",
    "crates/agentguard-risk",
    "crates/agentguard-store",
    "crates/agentguard-shim",
    "crates/agentguard-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["AgentGuard"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
walkdir = "2"
regex = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
