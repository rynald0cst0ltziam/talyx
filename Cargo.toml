[workspace]
resolver = "2"
members = [
    "crates/agentguard-core",
    "crates/agentguard-scanner",
    "crates/agentguard-adapters",
    "crates/agentguard-risk",
    "crates/agentguard-store",
    "crates/agentguard-shim",
    "crates/agentguard-cli",
    "crates/agentguard-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["AgentGuard"]
# 1.89 is the floor because agentguard-store relies on std::fs::File's
# native lock/lock_shared/unlock (stabilized in 1.89) for the decision
# store's cross-process file locking -- see that crate's module doc
# comment. Verified against the Rust 1.89 release notes, not assumed.
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
walkdir = "2"
regex = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
sha2 = "0.10"
toml = "0.8"
psl = "2"
ureq = { version = "3", features = ["json"] }
tar = "0.4"
flate2 = "1"
# Default features pull in native bzip2/lzma/zstd/xz C dependencies for
# compression methods a Python wheel never actually uses (wheels use
# "deflate" or "store" per the wheel spec) -- trimmed to keep the build
# pure-Rust (no C compiler requirement) and the dependency tree small.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
base64 = "0.22"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
