[workspace]
resolver = "2"
members = [
    "crates/agentguard-core",
    "crates/agentguard-scanner",
    "crates/agentguard-adapters",
    "crates/agentguard-risk",
    "crates/agentguard-store",
    "crates/agentguard-shim",
    "crates/agentguard-cli",
    "crates/agentguard-registry",
    "crates/agentguard-mcp-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["AgentGuard"]
# 1.89 is the floor because agentguard-store relies on std::fs::File's
# native lock/lock_shared/unlock (stabilized in 1.89) for the decision
# store's cross-process file locking -- see that crate's module doc
# comment. Verified against the Rust 1.89 release notes, not assumed.
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
walkdir = "2"
regex = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
once_cell = "1"
sha2 = "0.10"
toml = "0.8"
psl = "2"
# YAML support for agents whose native config format is YAML (Goose,
# Continue.dev, Aider). serde_yaml is deprecated by its own maintainer
# (last release 2024, marked "+deprecated" on crates.io) and serde_yml (a
# once-popular fork) was archived after unsoundness issues were raised --
# neither is acceptable for a security tool. serde-saphyr was chosen
# instead: actively maintained (v1.2.0, stable semver), explicitly
# emphasizes panic-free parsing (a real security-relevant property here,
# since this parses config files that could be attacker-controlled), and
# deserializes directly into serde_json::Value -- letting every existing
# JSON-shaped parser (parse_server_map etc.) be reused unmodified for YAML
# input, verified directly against its own docs before adding it.
serde-saphyr = "1"
ureq = { version = "3", features = ["json"] }
tar = "0.4"
flate2 = "1"
# Default features pull in native bzip2/lzma/zstd/xz C dependencies for
# compression methods a Python wheel never actually uses (wheels use
# "deflate" or "store" per the wheel spec) -- trimmed to keep the build
# pure-Rust (no C compiler requirement) and the dependency tree small.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
base64 = "0.22"
# AST-based capability extraction + source-to-sink taint for JS/TS and
# Python (agentguard-scanner/src/ast.rs, taint.rs). tree-sitter is an
# error-tolerant parser — it produces a usable tree even for a file with
# syntax errors, which matters for scanning attacker-controlled source.
# The grammar crates bundle a C parser compiled by the `cc` crate at
# build time (same C-toolchain requirement `ring` already imposes).
# `.ts`/`.tsx` are parsed with the JavaScript grammar (TS type syntax
# produces a few ERROR nodes but the call expressions we analyse still
# parse) rather than pulling in the version-skewed typescript grammar.
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
